name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Install Ed25519 support
        run: python -m pip install cryptography
      - name: Full check (unit tests + all probe harnesses)
        run: sh scripts/check.sh python
      - name: Demo run + ledger verify
        run: |
          PYTHONPATH=src python -c "import sys; sys.argv=['crow','--home','/tmp/crow-home','demo']; from crow_os.cli import main; main()"
          PYTHONPATH=src python -c "import sys; sys.argv=['crow','--home','/tmp/crow-home','verify']; from crow_os.cli import main; main()"

  workspace-docker-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated Docker runtime
        working-directory: apps/crow_os_workspace
        run: |
          mkdir -p var
          echo "CROW_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "CROW_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build, start, authenticate and verify persistent workspace
        working-directory: apps/crow_os_workspace
        env:
          CROW_AUTH_REQUIRED: "true"
          CROW_AUTH_USERNAME: ci
          CROW_AUTH_PASSWORD: ci-only-test-password
          CROW_PUBLISH_ADDR: 127.0.0.1
          CROW_PUBLISH_PORT: "8765"
          OLLAMA_HOST: http://host.docker.internal:11434
        run: |
          set -Eeuo pipefail
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker compose logs --no-color || true
            fi
            docker compose down || true
            exit "$status"
          }
          trap cleanup EXIT
          docker compose config --quiet
          docker compose up -d --build
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:8765/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          unauthenticated=$(curl --silent --show-error -o /tmp/crow-unauth.json -w "%{http_code}" http://127.0.0.1:8765/api/overview)
          test "$unauthenticated" = "401"
          curl --silent --show-error --fail --user "ci:ci-only-test-password" http://127.0.0.1:8765/ >/tmp/crow-index.html
          curl --silent --show-error --fail --user "ci:ci-only-test-password" http://127.0.0.1:8765/api/overview >/tmp/crow-overview.json
          grep -q '"repo": "/repo"' /tmp/crow-overview.json
          test -s var/crow.sqlite
          docker compose down
          test -s var/crow.sqlite
          trap - EXIT
  workspace:
    runs-on: ubuntu-24.04
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Install workspace app dependencies
        working-directory: apps/crow_os_workspace
        run: python -m pip install -r requirements.txt
      - name: Test Crow OS workspace app
        working-directory: apps/crow_os_workspace
        run: python -m pytest -q
      - name: Validate hardened workspace Docker Compose
        env:
          CROW_AUTH_USERNAME: ci
          CROW_AUTH_PASSWORD: ci-only-test-password
        run: docker compose -f apps/crow_os_workspace/docker-compose.yml config --quiet
