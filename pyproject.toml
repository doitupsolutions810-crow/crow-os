[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crow-os"
version = "0.16.9"
description = "Personal agent operating system kernel: attested ledger, exact capabilities, role-checked workflow."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
crow = "crow_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
